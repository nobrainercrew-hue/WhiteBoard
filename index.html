<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>판서 화이트보드 · 함께 그리기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: full-bleed board canvas, three floating chrome bars (zoom TL, actions TR, tools bottom) */
:root{
  --board:#ffffff; --dot:#cbd2dd; --board-ink:#8a93a3;
  --chrome:#ffffff; --chrome-2:#eef1f6; --ink:#1b2130; --muted:#667085; --line:#dde2ea;
  --accent:#2a63d4; --accent-ink:#ffffff; --danger:#d63b34; --ok:#1f9d55; --warn:#e08a00;
  --shadow:0 6px 24px rgba(22,34,60,.14),0 1px 3px rgba(22,34,60,.10);
  --ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --chrome:#1c2029; --chrome-2:#2a303c; --ink:#e9ecf2; --muted:#9aa3b4; --line:#363d4a;
  --accent:#7aa2ff; --accent-ink:#0f1420; --danger:#ff7a72;
  --shadow:0 8px 28px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --chrome:#1c2029; --chrome-2:#2a303c; --ink:#e9ecf2; --muted:#9aa3b4; --line:#363d4a;
  --accent:#7aa2ff; --accent-ink:#0f1420; --danger:#ff7a72;
  --shadow:0 8px 28px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark}

html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--board);color:var(--ink);font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;touch-action:none;-webkit-touch-callout:none}
#live{pointer-events:none}
#board{cursor:crosshair}

.bar{position:fixed;z-index:5;display:flex;align-items:center;gap:2px;padding:4px;background:var(--chrome);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.bar.tl{top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px)}
.bar.tr{top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px)}
.bar.bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%);max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
.tb{flex:none;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;font:inherit;padding:0}
.tb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb:hover{background:var(--chrome-2)}
.tb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tb:disabled{opacity:.35;cursor:default;background:transparent}
.tb:focus-visible,.chip:focus-visible,.sw:focus-visible,.sz:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.zoom{width:auto;min-width:56px;padding:0 6px;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.peers{width:auto;gap:4px;display:flex;align-items:center;padding:0 8px;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.dot.on{background:var(--ok)}
.sep{flex:none;width:1px;height:24px;background:var(--line);margin:0 4px}
.cur{width:22px;height:22px;border-radius:50%;border:2px solid var(--chrome);box-shadow:0 0 0 1px var(--line)}

#status{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 68px);font-size:12px;color:var(--muted);background:var(--chrome);border:1px solid var(--line);border-radius:999px;padding:3px 10px;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
#status b{color:var(--ink);font-weight:600}

#pop{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 68px);background:var(--chrome);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px;display:grid;gap:12px;width:min(300px,calc(100vw - 24px))}
#pop h3{margin:0;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--chrome);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.custom{position:relative;width:30px;height:30px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px var(--line);background:conic-gradient(#e0413a,#f08c00,#ffd400,#1f9d55,#2f6fe4,#8e44d6,#e0413a)}
.custom input{position:absolute;inset:-6px;width:42px;height:42px;opacity:0;cursor:pointer}
.sz{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
.sz[aria-pressed="true"]{border-color:var(--accent);background:var(--chrome-2)}
.sz i{display:block;border-radius:50%;background:var(--ink)}

#ring{position:fixed;left:0;top:0;z-index:3;pointer-events:none;border-radius:50%;border:1px solid rgba(20,26,40,.75);box-shadow:0 0 0 1px rgba(255,255,255,.85);display:none}

#hint{position:fixed;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;color:var(--board-ink);padding-inline:24px;gap:8px}
#hint strong{font-size:20px;font-weight:500;color:#5b6475}
#hint span{font-size:13px;line-height:1.7;max-width:34ch}

.confirm{position:fixed;z-index:7;top:calc(env(safe-area-inset-top,0px) + 64px);right:calc(env(safe-area-inset-right,0px) + 12px);background:var(--chrome);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;width:min(260px,calc(100vw - 24px));display:grid;gap:12px;font-size:14px}
.confirm p{margin:0;line-height:1.5}
.btns{display:flex;gap:8px;justify-content:flex-end}
.btn{font:inherit;font-size:14px;border-radius:10px;padding:8px 14px;border:1px solid var(--line);background:var(--chrome);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#modal{position:fixed;inset:0;z-index:9;background:rgba(10,14,22,.55);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
#modal .card{background:var(--chrome);border-radius:16px;padding:16px;display:grid;gap:12px;max-width:min(720px,100%);max-height:100%;box-shadow:var(--shadow)}
#modal img{max-width:100%;max-height:60vh;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
#modal p{margin:0;font-size:13px;color:var(--muted)}

#toast{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 64px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--chrome);font-size:13px;padding:8px 14px;border-radius:999px;max-width:calc(100vw - 32px);text-align:center;transition:opacity .2s}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
@media (max-width:420px){.tb{width:38px;height:38px}.sep{margin:0 2px}.zoom{min-width:50px}}
</style>
</head>
<body>
<canvas id="board" aria-label="그리기 영역"></canvas>
<canvas id="live"></canvas>
<div id="ring"></div>

<div id="hint">
  <strong>펜, 손가락, 마우스로 그려보세요</strong>
  <span>두 손가락으로 이동·확대 · Ctrl+휠로 확대 · 스페이스+드래그로 이동 · S펜 버튼을 누른 채 그리면 지우개 · Ctrl+Z로 내 직전 획 취소 · 오른쪽 위 사람 버튼으로 링크를 복사해 보내면 함께 그릴 수 있어요</span>
</div>

<div class="bar tl" role="toolbar" aria-label="확대">
  <button class="tb" id="zoomOut" title="축소" aria-label="축소"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
  <button class="tb zoom" id="zoomLbl" title="100%로 맞추기">100%</button>
  <button class="tb" id="zoomIn" title="확대" aria-label="확대"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
</div>

<div class="bar tr" role="toolbar" aria-label="보드">
  <button class="tb peers" id="shareBtn" title="링크 복사해서 같이 그리기" aria-label="공유 링크 복사"><span class="dot" id="netDot"></span><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0111 0"/><circle cx="17" cy="9" r="2.3"/><path d="M15.5 14.2A4.5 4.5 0 0121 18.5"/></svg><span id="peerN">1</span></button>
  <span class="sep"></span>
  <button class="tb" id="gridBtn" title="점 격자" aria-label="점 격자" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r=".6"/><circle cx="12" cy="6" r=".6"/><circle cx="18" cy="6" r=".6"/><circle cx="6" cy="12" r=".6"/><circle cx="12" cy="12" r=".6"/><circle cx="18" cy="12" r=".6"/><circle cx="6" cy="18" r=".6"/><circle cx="12" cy="18" r=".6"/><circle cx="18" cy="18" r=".6"/></svg></button>
  <button class="tb" id="penOnlyBtn" title="펜 전용 모드: 손가락은 화면 이동만" aria-label="펜 전용 모드" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M14.5 4.5l5 5L10 19H5v-5z"/><path d="M12 7l5 5"/><path d="M3 21h4"/></svg></button>
  <button class="tb" id="exportBtn" title="이미지로 내보내기" aria-label="이미지로 내보내기"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.4"/></svg></button>
</div>

<div class="bar bottom" role="toolbar" aria-label="도구">
  <button class="tb" data-tool="pen" title="펜 (P)" aria-label="펜" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg></button>
  <button class="tb" data-tool="hl" title="형광펜 (M)" aria-label="형광펜" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M9 15l-3 3v2h3l3-3"/><path d="M9 15l7-8 3 3-7 7z"/><path d="M14 21h7"/></svg></button>
  <button class="tb" data-tool="er" title="지우개 (E)" aria-label="지우개" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M9 20h11"/><path d="M5 15l9-9 5 5-8 9H9z"/><path d="M9.5 10.5l5 5"/></svg></button>
  <button class="tb" data-tool="hand" title="이동 (H)" aria-label="이동" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg></button>
  <span class="sep"></span>
  <button class="tb" id="swatchBtn" title="색상·굵기" aria-label="색상과 굵기" aria-expanded="false"><span class="cur" id="cur"></span></button>
  <span class="sep"></span>
  <button class="tb" id="undoBtn" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소" disabled><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
  <button class="tb" id="redoBtn" title="다시 실행 (Ctrl+Shift+Z)" aria-label="다시 실행" disabled><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
</div>

<div id="status">입력 대기 중</div>

<div id="pop" hidden>
  <div id="colorSec"><h3>색상</h3><div class="row" id="colors" style="margin-top:8px"></div></div>
  <div><h3 id="sizeTitle">굵기</h3><div class="row" id="sizes" style="margin-top:8px"></div></div>
</div>


<div id="modal" hidden>
  <div class="card">
    <img id="outImg" alt="내보낸 화이트보드 이미지">
    <p>이미지를 길게 누르거나 마우스 오른쪽 버튼으로 저장할 수 있어요.</p>
    <div class="btns"><button class="btn" id="closeModal">닫기</button><button class="btn primary" id="copyImg">이미지 복사</button></div>
  </div>
</div>

<div id="toast" hidden></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const board=$('#board'),live=$('#live'),bctx=board.getContext('2d'),lctx=live.getContext('2d');
const ring=$('#ring'),statusEl=$('#status'),zoomLbl=$('#zoomLbl');
const BOARD='#ffffff',DOT='#cbd2dd',LS='board-live-v1';
const COLORS=['#1f2430','#2f6fe4','#e0413a','#1f9d55','#f08c00','#8e44d6','#ffd400','#ff5fa2'];
const SIZES={pen:[2,4,8,14],hl:[12,22,34,48],er:[12,24,44,72]};
const NAMES={pen:'펜',hl:'형광펜',er:'지우개',hand:'이동'};
let dpr=1,W=0,H=0;
const view={x:0,y:0,s:1};
let strokes=[],nextId=1;
const CID=Math.random().toString(36).slice(2,10);
const remoteLive=new Map();
const undo=[],redo=[];
const st={tool:'pen',pen:{color:'#1f2430',size:4},hl:{color:'#ffd400',size:22},er:{size:24},grid:true,penOnly:false,penSeen:false};

// ---------- storage ----------
try{
  const d=JSON.parse(localStorage.getItem(LS)||'null');
  if(d){Object.assign(view,d.view||{});
    for(const k of ['pen','hl','er']) if(d.st&&d.st[k]) Object.assign(st[k],d.st[k]);
    if(d.st){st.grid=d.st.grid!==false;st.penOnly=!!d.st.penOnly;st.penSeen=!!d.st.penSeen;}
    }
}catch(e){}
let saveT=0;
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify({view,st:{pen:st.pen,hl:st.hl,er:st.er,grid:st.grid,penOnly:st.penOnly,penSeen:st.penSeen}}))}catch(e){}},400)}

// ---------- geometry ----------
function bbox(s){const p=s.pts;let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;for(let i=0;i<p.length;i+=3){if(p[i]<a)a=p[i];if(p[i]>c)c=p[i];if(p[i+1]<b)b=p[i+1];if(p[i+1]>d)d=p[i+1]}const r=s.size;s.b=[a-r,b-r,c+r,d+r];return s}
const MINZ=.02,MAXZ=50;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const toWorld=(x,y)=>[(x-view.x)/view.s,(y-view.y)/view.s];

// ---------- rendering ----------
function resize(){dpr=Math.min(window.devicePixelRatio||1,3);W=innerWidth;H=innerHeight;
  for(const c of [board,live]){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);c.style.width=W+'px';c.style.height=H+'px'}
  render();drawLive()}
let rq=false;
function requestRender(){if(!rq){rq=true;requestAnimationFrame(()=>{rq=false;render()})}}
function render(){
  const c=bctx;c.setTransform(dpr,0,0,dpr,0,0);c.globalAlpha=1;c.fillStyle=BOARD;c.fillRect(0,0,W,H);
  if(st.grid)drawGrid(c);
  c.setTransform(dpr*view.s,0,0,dpr*view.s,dpr*view.x,dpr*view.y);
  const x0=-view.x/view.s,y0=-view.y/view.s,x1=x0+W/view.s,y1=y0+H/view.s;
  for(const s of strokes){const b=s.b;if(b[2]<x0||b[0]>x1||b[3]<y0||b[1]>y1)continue;drawStroke(c,s)}
  zoomLbl.textContent=Math.round(view.s*100)+'%';
  $('#hint').hidden=strokes.length>0||!!act;
}
function drawGrid(c){let g=24;while(g*view.s<14)g*=2;while(g*view.s>56)g/=2;const step=g*view.s;
  const ox=((view.x%step)+step)%step,oy=((view.y%step)+step)%step,r=1.6;
  c.fillStyle=DOT;c.beginPath();for(let x=ox;x<W;x+=step)for(let y=oy;y<H;y+=step)c.rect(x-r/2,y-r/2,r,r);c.fill()}
function drawStroke(c,s){
  const p=s.pts,n=p.length/3;if(!n)return;
  c.strokeStyle=s.color;c.lineCap='round';c.lineJoin='round';
  if(s.tool==='hl'){c.globalAlpha=.38;c.lineWidth=s.size;c.beginPath();c.moveTo(p[0],p[1]);
    if(n===1)c.lineTo(p[0]+.01,p[1]);else{for(let i=1;i<n-1;i++)c.quadraticCurveTo(p[i*3],p[i*3+1],(p[i*3]+p[i*3+3])/2,(p[i*3+1]+p[i*3+4])/2);c.lineTo(p[n*3-3],p[n*3-2])}
    c.stroke();c.globalAlpha=1;return}
  if(n===1){c.fillStyle=s.color;c.beginPath();c.arc(p[0],p[1],Math.max(.5,s.size*p[2]/2),0,Math.PI*2);c.fill();return}
  let sx=p[0],sy=p[1];
  for(let i=1;i<n;i++){const cx=p[i*3-3],cy=p[i*3-2],ex=(cx+p[i*3])/2,ey=(cy+p[i*3+1])/2;
    c.lineWidth=s.size*(p[i*3-1]+p[i*3+2])/2;c.beginPath();c.moveTo(sx,sy);c.quadraticCurveTo(cx,cy,ex,ey);c.stroke();sx=ex;sy=ey}
  c.lineWidth=s.size*p[n*3-1];c.beginPath();c.moveTo(sx,sy);c.lineTo(p[n*3-3],p[n*3-2]);c.stroke()
}
let lq=false;
function queueLive(){if(!lq){lq=true;requestAnimationFrame(()=>{lq=false;drawLive()})}}
function drawLive(){lctx.setTransform(dpr,0,0,dpr,0,0);lctx.clearRect(0,0,W,H);
  lctx.setTransform(dpr*view.s,0,0,dpr*view.s,dpr*view.x,dpr*view.y);
  for(const r of remoteLive.values())drawStroke(lctx,r);
  if(act&&act.kind==='draw')drawStroke(lctx,act.stroke)}

// ---------- history ----------
function pushUndo(a){undo.push(a);redo.length=0;if(undo.length>300)undo.shift();updUR()}
function sortZ(){strokes.sort((a,b)=>a.z-b.z)}
function insert(list,net=true){const have=new Set(strokes.map(s=>s.id));const fresh=list.filter(s=>!have.has(s.id));strokes.push(...fresh);sortZ();if(net&&fresh.length)send({t:'add',s:fresh.map(wire)})}
function remove(list,net=true){const ids=new Set(list.map(s=>s.id));strokes=strokes.filter(s=>!ids.has(s.id));if(net)send({t:'rm',ids:[...ids]})}
function apply(a,rev){if(a.t==='add'){rev?remove(a.s):insert(a.s)}else{rev?insert(a.s):remove(a.s)}requestRender();saveSoon();updUR()}
function doUndo(){if(act)return;const a=undo.pop();if(!a)return;apply(a,true);redo.push(a);updUR()}
function doRedo(){if(act)return;const a=redo.pop();if(!a)return;apply(a,false);undo.push(a);updUR()}
function updUR(){$('#undoBtn').disabled=!undo.length;$('#redoBtn').disabled=!redo.length}

// ---------- input ----------
const touches=new Map();
let act=null,spaceDown=false,lastType='';
function setStatus(e){
  const t=e.pointerType;let html;
  if(t==='pen'){const er=(e.buttons&32)||(e.buttons&2);html='<b>펜</b>'+(er?' · 버튼 지우개':'')+' · 필압 '+Math.round((e.pressure||0)*100)+'%'}
  else if(t==='touch')html='<b>손가락</b>'+(st.penOnly?' · 이동 전용':'');
  else html='<b>마우스</b>';
  if(st.penOnly&&t!=='touch')html+=' · 펜 전용 모드';
  statusEl.innerHTML=html;lastType=t}

function startTool(e,tool){
  if(tool==='er'){const w=toWorld(e.clientX,e.clientY);act={kind:'erase',id:e.pointerId,type:e.pointerType,last:w,removed:[]};hitTest(w[0],w[1]);return}
  const cfg=st[tool];
  act={kind:'draw',id:e.pointerId,type:e.pointerType,pressure:e.pointerType==='pen',m:null,lx:null,ly:null,
    stroke:{id:CID+'.'+(nextId++),tool,color:cfg.color,size:cfg.size,pts:[]},sent:0,lastSend:0};
  // sizes are in screen px at 100%; keep world size so zoom scales naturally
  act.stroke.size=cfg.size/view.s;
  addPoint(e);queueLive();$('#hint').hidden=true}
function addPoint(ev){
  const x=ev.clientX,y=ev.clientY;
  if(act.lx!==null&&Math.hypot(x-act.lx,y-act.ly)<.8)return;
  act.lx=x;act.ly=y;let m=1;
  if(act.pressure){const tgt=clamp(.2+1.3*(ev.pressure||0),.15,1.5);m=act.m==null?tgt:act.m*.55+tgt*.45;act.m=m}
  const w=toWorld(x,y);act.stroke.pts.push(w[0],w[1],m)}
function sendLive(force){
  if(!act||act.kind!=='draw')return;const now=performance.now();
  if(!force&&now-act.lastSend<40)return;const s=act.stroke;if(act.sent>=s.pts.length)return;
  send({t:'lp',id:s.id,tool:s.tool,color:s.color,size:s.size,i:act.sent,p:s.pts.slice(act.sent).map((v,i)=>((act.sent+i)%3===2)?Math.round(v*100)/100:Math.round(v*10)/10)},true);
  act.sent=s.pts.length;act.lastSend=now}
function commitStroke(){
  const s=act.stroke;if(!s.pts.length)return;
  s.pts=s.pts.map((v,i)=>i%3===2?Math.round(v*100)/100:Math.round(v*10)/10);
  s.z=1e12+nextId;bbox(s);strokes.push(s);send({t:'add',s:[wire(s)]});pushUndo({t:'add',s:[s]});
  bctx.setTransform(dpr*view.s,0,0,dpr*view.s,dpr*view.x,dpr*view.y);drawStroke(bctx,s)}
function discardLive(){if(act&&act.kind==='draw')send({t:'le',id:act.stroke.id},true);act=null;drawLive()}
function startPan(e){act={kind:'pan',id:e.pointerId,type:e.pointerType,lx:e.clientX,ly:e.clientY};board.style.cursor='grabbing'}
function startPinch(){const p=[...touches.values()].slice(0,2);
  act={kind:'pinch',type:'touch',d0:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1,c0:{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2},v:{...view}}}
function doPinch(){const p=[...touches.values()].slice(0,2);if(p.length<2)return;
  const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),c={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2},v=act.v;
  const ns=clamp(v.s*Math.pow(d/act.d0,.85),MINZ,MAXZ),wx=(act.c0.x-v.x)/v.s,wy=(act.c0.y-v.y)/v.s;
  view.s=ns;view.x=c.x-wx*ns;view.y=c.y-wy*ns;requestRender()}
function eraseTo(sx,sy){const w=toWorld(sx,sy),r=st.er.size/2/view.s,l=act.last,d=Math.hypot(w[0]-l[0],w[1]-l[1]),n=Math.max(1,Math.ceil(d/(r*.5)));
  for(let k=1;k<=n;k++)hitTest(l[0]+(w[0]-l[0])*k/n,l[1]+(w[1]-l[1])*k/n);act.last=w}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;let t=L?((px-ax)*dx+(py-ay)*dy)/L:0;t=clamp(t,0,1);return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function hitTest(x,y){const r=st.er.size/2/view.s;let hit=false;
  for(let i=strokes.length-1;i>=0;i--){const s=strokes[i],b=s.b;if(x<b[0]-r||x>b[2]+r||y<b[1]-r||y>b[3]+r)continue;
    const p=s.pts,n=p.length/3;let on=false;
    for(let j=0;j<n&&!on;j++){const half=s.tool==='hl'?s.size/2:s.size*p[j*3+2]/2;
      const dd=j===0?Math.hypot(x-p[0],y-p[1]):segDist(x,y,p[j*3-3],p[j*3-2],p[j*3],p[j*3+1]);if(dd<=r+half)on=true}
    if(on){act.removed.push(s);strokes.splice(i,1);pendingRm.push(s.id);hit=true}}
  if(hit){requestRender();if(!rmQ){rmQ=true;requestAnimationFrame(flushRm)}}}
let pendingRm=[],rmQ=false;
function flushRm(){rmQ=false;if(pendingRm.length){send({t:'rm',ids:pendingRm});pendingRm=[]}}
function finishErase(){flushRm();if(act.removed.length)pushUndo({t:'erase',s:act.removed});saveSoon()}
function endTouchAction(){if(!act||act.type!=='touch')return;if(act.kind==='draw')discardLive();else if(act.kind==='erase'){finishErase();act=null}else act=null}

board.addEventListener('pointerdown',e=>{
  closePop();try{window.focus()}catch(_){}
  try{board.setPointerCapture(e.pointerId)}catch(_){}
  setStatus(e);
  if(e.pointerType==='touch'){
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});ring.style.display='none';
    if(touches.size>=2){if(!act||act.type==='touch'){endTouchAction();startPinch()}return}
    if(act)return;
    if(st.penOnly||st.tool==='hand')startPan(e);else startTool(e,st.tool);return}
  if(e.pointerType==='pen'){
    if(!st.penSeen){st.penSeen=true;if(!st.penOnly){setPenOnly(true);toast('펜이 감지됐어요. 이제 손가락은 화면 이동에만 쓰여요.')}}
    if(act&&act.type==='touch'){endTouchAction();act=null;touches.clear()}  // palm rejection
    if(act)return;
    const eraserBtn=(e.buttons&32)||e.button===5||(e.buttons&2);
    if(eraserBtn)startTool(e,'er');else if(st.tool==='hand')startPan(e);else startTool(e,st.tool);return}
  if(act)return;
  if(e.button===1||e.button===2||spaceDown||st.tool==='hand')startPan(e);else if(e.button===0)startTool(e,st.tool);
});
board.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'){if(touches.has(e.pointerId))touches.set(e.pointerId,{x:e.clientX,y:e.clientY})}
  else{updateRing(e);if(e.pointerType==='pen')setStatus(e)}
  if(!act)return;
  if(act.kind==='pinch'){if(touches.has(e.pointerId))doPinch();return}
  if(e.pointerId!==act.id)return;
  if(act.kind==='pan'){view.x+=e.clientX-act.lx;view.y+=e.clientY-act.ly;act.lx=e.clientX;act.ly=e.clientY;requestRender();return}
  let evs=e.getCoalescedEvents?e.getCoalescedEvents():[];if(!evs.length)evs=[e];
  if(act.kind==='draw'){for(const ev of evs)addPoint(ev);queueLive();sendLive()}
  else if(act.kind==='erase'){for(const ev of evs)eraseTo(ev.clientX,ev.clientY)}
});
function onUp(e){
  touches.delete(e.pointerId);
  if(!act)return;
  if(act.kind==='pinch'){if(touches.size<2){saveSoon();if(touches.size===1){const [id,pt]=[...touches][0];act={kind:'pan',id,type:'touch',lx:pt.x,ly:pt.y}}else act=null}return}
  if(e.pointerId!==act.id)return;
  if(act.kind==='draw')commitStroke();else if(act.kind==='erase')finishErase();
  act=null;drawLive();saveSoon();setCursor();requestRender()}
board.addEventListener('pointerup',onUp);
board.addEventListener('pointercancel',onUp);
board.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch')ring.style.display='none'});
board.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());

window.addEventListener('wheel',e=>{if(e.target.closest&&e.target.closest('#modal,#pop')&&!(e.ctrlKey||e.metaKey))return;e.preventDefault();
  if(e.ctrlKey||e.metaKey)zoomAt(e.clientX,e.clientY,Math.exp(-clamp(e.deltaY*(e.deltaMode?16:1),-40,40)*0.0025));
  else{const k=e.deltaMode?16:1;if(e.shiftKey&&!e.deltaX){view.x-=e.deltaY*k}else{view.x-=e.deltaX*k;view.y-=e.deltaY*k}requestRender();saveSoon()}
},{passive:false});
function zoomAt(cx,cy,f){const ns=clamp(view.s*f,MINZ,MAXZ),wx=(cx-view.x)/view.s,wy=(cy-view.y)/view.s;view.s=ns;view.x=cx-wx*ns;view.y=cy-wy*ns;zoomLbl.textContent=Math.round(ns*100)+'%';requestRender();saveSoon()}

function updateRing(e){
  const er=st.tool==='er'||(e.pointerType==='pen'&&((e.buttons&32)||(e.buttons&2)));
  const tool=er?'er':st.tool;
  if(tool==='hand'||spaceDown){ring.style.display='none';return}
  const d=Math.max(4,er?st.er.size:st[tool].size);
  ring.style.width=ring.style.height=d+'px';ring.style.transform=`translate(${e.clientX-d/2}px,${e.clientY-d/2}px)`;ring.style.display='block'}
function setCursor(){board.style.cursor=(st.tool==='hand'||spaceDown)?'grab':st.tool==='er'?'none':'crosshair'}

// ---------- network ----------
const wire=s=>({id:s.id,z:s.z,tool:s.tool,color:s.color,size:s.size,pts:s.pts});
let room=(location.pathname.match(/\/b\/([a-z0-9-]{3,40})/i)||[])[1];
if(!room){room=Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,6);try{history.replaceState(null,'','/b/'+room)}catch(_){}}
room=room.toLowerCase();
let ws=null,wsOpen=false,retry=0;const outbox=[];
function send(m,volatile){if(wsOpen){try{ws.send(JSON.stringify(m));return}catch(_){}}if(!volatile){outbox.push(m);if(outbox.length>2000)outbox.shift()}}
function setNet(on){wsOpen=on;$('#netDot').classList.toggle('on',on);$('#shareBtn').title=on?'링크 복사해서 같이 그리기':'서버에 다시 연결하는 중…'}
function connect(){
  const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?room='+encodeURIComponent(room)+'&cid='+CID;
  try{ws=new WebSocket(url)}catch(_){return schedule()}
  ws.onopen=()=>{retry=0;setNet(true);while(outbox.length&&wsOpen){ws.send(JSON.stringify(outbox.shift()))}};
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(_){return}onMsg(m)};
  ws.onclose=()=>{setNet(false);remoteLive.clear();drawLive();schedule()};
  ws.onerror=()=>{try{ws.close()}catch(_){}};
}
function schedule(){setTimeout(connect,Math.min(8000,500*2**retry++))}
function onMsg(m){
  if(m.t==='init'){strokes=(m.strokes||[]).map(bbox);sortZ();$('#peerN').textContent=m.n||1;requestRender();return}
  if(m.t==='n'){$('#peerN').textContent=m.n;return}
  if(m.t==='add'){const byId=new Map(strokes.map(s=>[s.id,s]));
    for(const s of m.s){const ex=byId.get(s.id);if(ex){ex.z=s.z}else{bbox(s);strokes.push(s)}remoteLive.delete(s.id)}
    sortZ();requestRender();drawLive();return}
  if(m.t==='rm'){const ids=new Set(m.ids);strokes=strokes.filter(s=>!ids.has(s.id));requestRender();return}
  if(m.t==='lp'){let r=remoteLive.get(m.id);
    if(!r||m.i===0){r={id:m.id,tool:m.tool,color:m.color,size:m.size,pts:[],t:0};remoteLive.set(m.id,r)}
    if(m.i===r.pts.length)r.pts.push(...m.p);r.t=performance.now();queueLive();return}
  if(m.t==='le'){remoteLive.delete(m.id);queueLive();return}
  if(m.t==='gone'){for(const k of remoteLive.keys())if(k.startsWith(m.cid+'.'))remoteLive.delete(k);queueLive();return}
}
setInterval(()=>{const now=performance.now();let ch=false;for(const [k,r] of remoteLive)if(now-r.t>8000){remoteLive.delete(k);ch=true}if(ch)queueLive()},3000);
$('#shareBtn').onclick=()=>{const link=location.origin+'/b/'+room;
  const ok=()=>toast('링크를 복사했어요. 보내면 같은 보드에서 함께 그릴 수 있어요.');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(link).then(ok).catch(()=>toast(link));else toast(link)};

// ---------- UI ----------
const toolBtns=[...document.querySelectorAll('[data-tool]')];
function setTool(t){st.tool=t;toolBtns.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tool===t)));updSwatch();setCursor();if(!$('#pop').hidden)buildPop();saveSoon()}
toolBtns.forEach(b=>b.addEventListener('click',()=>{const t=b.dataset.tool;if(t===st.tool&&t!=='hand'){togglePop()}else{setTool(t);closePop()}}));
function updSwatch(){const t=st.tool,cur=$('#cur');$('#swatchBtn').disabled=t==='hand';
  if(t==='er'){cur.style.background='var(--chrome-2)'}else if(t==='hand'){cur.style.background='transparent'}else cur.style.background=st[t].color}
function togglePop(){$('#pop').hidden?openPop():closePop()}
function openPop(){if(st.tool==='hand')return;buildPop();$('#pop').hidden=false;$('#swatchBtn').setAttribute('aria-expanded','true')}
function closePop(){$('#pop').hidden=true;$('#swatchBtn').setAttribute('aria-expanded','false')}
function buildPop(){
  const t=st.tool,colors=$('#colors'),sizes=$('#sizes');
  $('#colorSec').hidden=t==='er';$('#sizeTitle').textContent=NAMES[t]+' 굵기';
  colors.innerHTML='';
  if(t!=='er'){COLORS.forEach(c=>{const b=document.createElement('button');b.className='sw';b.style.background=c;b.setAttribute('aria-label','색 '+c);b.setAttribute('aria-pressed',String(st[t].color===c));
      b.onclick=()=>{st[t].color=c;updSwatch();buildPop();saveSoon()};colors.appendChild(b)});
    const lab=document.createElement('label');lab.className='custom';lab.title='직접 고르기';
    const inp=document.createElement('input');inp.type='color';inp.id='customColor';inp.value=st[t].color;inp.setAttribute('aria-label','직접 색 고르기');
    inp.oninput=()=>{st[t].color=inp.value;updSwatch();saveSoon()};lab.appendChild(inp);colors.appendChild(lab)}
  sizes.innerHTML='';
  SIZES[t].forEach(s=>{const b=document.createElement('button');b.className='sz';b.setAttribute('aria-pressed',String(st[t].size===s));b.setAttribute('aria-label',s+'px');
    const i=document.createElement('i');const d=t==='pen'?Math.min(24,s+2):Math.min(26,s*.45+3);i.style.width=i.style.height=d+'px';
    if(t==='hl'){i.style.background=st.hl.color;i.style.opacity=.6}if(t==='er'){i.style.background='transparent';i.style.border='1.5px solid var(--ink)'}
    b.appendChild(i);b.onclick=()=>{st[t].size=s;buildPop();saveSoon()};sizes.appendChild(b)})}
$('#swatchBtn').onclick=togglePop;
$('#undoBtn').onclick=doUndo;$('#redoBtn').onclick=doRedo;
$('#zoomIn').onclick=()=>zoomAt(W/2,H/2,1.1);
$('#zoomOut').onclick=()=>zoomAt(W/2,H/2,1/1.1);
$('#zoomLbl').onclick=()=>zoomAt(W/2,H/2,1/view.s);
function setGrid(v){st.grid=v;$('#gridBtn').setAttribute('aria-pressed',String(v));requestRender();saveSoon()}
$('#gridBtn').onclick=()=>setGrid(!st.grid);
function setPenOnly(v){st.penOnly=v;$('#penOnlyBtn').setAttribute('aria-pressed',String(v));saveSoon()}
$('#penOnlyBtn').onclick=()=>{setPenOnly(!st.penOnly);toast(st.penOnly?'펜 전용 모드: 손가락은 화면 이동만 해요':'손가락으로도 그릴 수 있어요')};

let outCanvas=null;
$('#exportBtn').onclick=()=>{
  if(!strokes.length){toast('보드가 비어 있어요');return}
  let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;for(const s of strokes){a=Math.min(a,s.b[0]);b=Math.min(b,s.b[1]);c=Math.max(c,s.b[2]);d=Math.max(d,s.b[3])}
  const pad=40,w=c-a+pad*2,h=d-b+pad*2,sc=Math.min(2,4096/w,4096/h);
  const cv=document.createElement('canvas');cv.width=Math.ceil(w*sc);cv.height=Math.ceil(h*sc);
  const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.setTransform(sc,0,0,sc,(pad-a)*sc,(pad-b)*sc);
  for(const s of strokes)drawStroke(x,s);
  outCanvas=cv;$('#outImg').src=cv.toDataURL('image/png');$('#modal').hidden=false;$('#closeModal').focus()};
$('#closeModal').onclick=()=>$('#modal').hidden=true;
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').hidden=true});
$('#copyImg').onclick=()=>{
  if(!outCanvas||typeof ClipboardItem==='undefined'||!navigator.clipboard||!navigator.clipboard.write){toast('이 환경에선 복사가 안 돼요. 이미지를 길게 누르거나 우클릭해 저장하세요.');return}
  const p=new Promise(r=>outCanvas.toBlob(r,'image/png'));
  navigator.clipboard.write([new ClipboardItem({'image/png':p})]).then(()=>toast('이미지를 복사했어요')).catch(()=>toast('복사가 막혀 있어요. 이미지를 길게 누르거나 우클릭해 저장하세요.'))};

let toastT=0;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;t.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.hidden=true,220)},2400)}

addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const k=(e.code&&e.code.startsWith('Key'))?e.code.slice(3).toLowerCase():e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo();return}
  if(mod&&k==='y'){e.preventDefault();doRedo();return}
  if(mod&&(e.key==='+'||e.key==='='||e.code==='NumpadAdd')){e.preventDefault();zoomAt(W/2,H/2,1.1);return}
  if(mod&&(e.key==='-'||e.code==='NumpadSubtract')){e.preventDefault();zoomAt(W/2,H/2,1/1.1);return}
  if(mod&&e.key==='0'){e.preventDefault();zoomAt(W/2,H/2,1/view.s);return}
  if(mod)return;
  if(e.key===' '){if(!spaceDown){spaceDown=true;setCursor();ring.style.display='none'}e.preventDefault();return}
  if(e.key==='Escape'){closePop();$('#modal').hidden=true;return}
  const map={p:'pen',m:'hl',e:'er',h:'hand'};if(map[k])setTool(map[k]);
  if(k==='+'||k==='=')zoomAt(W/2,H/2,1.1);if(k==='-')zoomAt(W/2,H/2,1/1.1);if(k==='0')zoomAt(W/2,H/2,1/view.s);
});
addEventListener('keyup',e=>{if(e.key===' '){spaceDown=false;setCursor()}});
addEventListener('resize',resize);

// init
setNet(false);connect();
setTool(st.tool);setGrid(st.grid);setPenOnly(st.penOnly);updUR();resize();
})();
</script>
</body>
</html>
